databases:
  - name: codealpha-jobboard-db
    plan: free
    databaseName: codealpha_jobboard
    user: codealpha_jobboard

services:
  - type: web
    name: codealpha-jobboard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi:application
    healthCheckPath: /api/jobs/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codealpha-jobboard-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
      - key: FRONTEND_URL
        value: "http://localhost:5173"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"
